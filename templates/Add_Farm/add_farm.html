{% extends "base.html" %}

{% block title %}BioGrow - Register New Farm{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-12 pt-16">
    <div
        class="bg-white rounded-[2.5rem] shadow-[0_8px_30px_rgba(0,0,0,0.04)] border border-gray-100 overflow-hidden relative">

        <!-- Decorative Header Background -->
        <div class="h-32 bg-gradient-to-r from-emerald-600 to-teal-500 relative">
            <div
                class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4IiBoZWlnaHQ9IjgiPgo8cmVjdCB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBmaWxsPSIjZmZmIiBmaWxsLW9wYWNpdHk9IjAuMSI+PC9yZWN0Pgo8L3N2Zz4=')] opacity-20">
            </div>
        </div>

        <div class="px-8 pb-10 pt-0 relative sm:px-12">
            <!-- Floating Icon -->
            <div
                class="w-24 h-24 bg-white rounded-3xl mx-auto flex items-center justify-center text-emerald-600 shadow-xl border border-gray-100 -mt-12 mb-6 transform rotate-3">
                <i data-lucide="tractor" class="w-10 h-10"></i>
            </div>

            <div class="text-center mb-10">
                <h2 class="font-display text-3xl font-black text-gray-900 mb-2 tracking-tight">Register a New Farm</h2>
                <p class="text-gray-500 font-medium">Start tracking a new crop cycle to get AI-powered insights.</p>
            </div>

            <form action="{{ url_for('crop_tracking.add_farm') }}" method="POST" id="addFarmForm" class="space-y-6">
                <div>
                    <label for="farm_name"
                        class="block text-xs font-bold text-gray-600 uppercase tracking-widest mb-2 pl-1">Farm
                        Identifier</label>
                    <div
                        class="flex items-center overflow-hidden rounded-2xl border border-gray-200 bg-gray-50/50 focus-within:ring-4 focus-within:ring-emerald-500/20 focus-within:border-emerald-500 transition-all">
                        <span class="px-4 text-gray-400">
                            <i data-lucide="map-pin" class="w-5 h-5"></i>
                        </span>
                        <input type="text"
                            class="w-full bg-transparent px-2 py-4 text-sm font-semibold text-gray-900 placeholder-gray-400 outline-none"
                            id="farmName" name="farm_name" placeholder="e.g. North Field, Plot B..." required>
                    </div>
                    <div class="text-xs font-bold text-red-500 mt-1 pl-1" id="farmNameError"></div>
                </div>

                <div>
                    <label for="crop_standard_id"
                        class="block text-xs font-bold text-gray-600 uppercase tracking-widest mb-2 pl-1">Crop
                        Variety</label>
                    <div class="relative">
                        <select
                            class="w-full bg-gray-50/50 border border-gray-200 text-gray-900 text-sm font-semibold rounded-2xl focus:ring-4 focus:ring-emerald-500/20 focus:border-emerald-500 block p-4 outline-none transition-all appearance-none cursor-pointer"
                            id="cropVariety" name="crop_standard_id" required>
                            <option value="" selected disabled>Select a crop...</option>
                            {% for crop in crops %}
                            <option value="{{ crop.crop_standard_id }}">
                                {{ crop.display_name }}
                            </option>
                            {% endfor %}
                        </select>
                        <i data-lucide="chevron-down"
                            class="w-5 h-5 text-gray-400 absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                    </div>
                    <div class="text-xs font-bold text-red-500 mt-1 pl-1" id="cropVarietyError"></div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="sowing_date"
                            class="block text-xs font-bold text-gray-600 uppercase tracking-widest mb-2 pl-1">Sowing
                            Date</label>
                        <input type="date"
                            class="w-full bg-gray-50/50 border border-gray-200 text-gray-900 text-sm font-semibold rounded-2xl focus:ring-4 focus:ring-emerald-500/20 focus:border-emerald-500 block p-4 outline-none transition-all cursor-pointer"
                            id="sowingDate" name="sowing_date" required>
                        <div class="text-xs font-bold text-red-500 mt-1 pl-1" id="dateError"></div>
                    </div>

                    <div>
                        <label for="area_acres"
                            class="block text-xs font-bold text-gray-600 uppercase tracking-widest mb-2 pl-1">Total Area
                            <span class="lowercase tracking-normal text-gray-400">(acres)</span></label>
                        <div
                            class="flex items-center overflow-hidden rounded-2xl border border-gray-200 bg-gray-50/50 focus-within:ring-4 focus-within:ring-emerald-500/20 focus-within:border-emerald-500 transition-all">
                            <input type="number" step="0.1" min="0.1"
                                class="w-full bg-transparent px-4 py-4 text-sm font-semibold text-gray-900 outline-none"
                                id="areaAcres" name="area_acres" value="1.0" required>
                            <span
                                class="px-4 py-4 text-sm font-bold text-gray-500 bg-gray-100/80 border-l border-gray-200 h-full">Acres</span>
                        </div>
                        <div class="text-xs font-bold text-red-500 mt-1 pl-1" id="areaError"></div>
                    </div>
                </div>

                <div class="pt-6 flex flex-col gap-3">
                    <button type="submit"
                        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-lg py-4 px-6 rounded-2xl shadow-[0_8px_20px_rgba(16,185,129,0.3)] hover:-translate-y-0.5 transition-all flex justify-center items-center gap-2"
                        id="submitBtn">
                        <i data-lucide="save" class="w-5 h-5"></i> Register Farm Focus
                    </button>
                    <a href="{{ url_for('crop_tracking.crop_tracking') }}"
                        class="w-full bg-white hover:bg-gray-50 border border-gray-200 text-gray-600 font-bold text-lg py-4 px-6 rounded-2xl text-center transition-colors">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block js %}
<script src="{{ url_for('static', filename='js/add_farm_script.js') }}"></script>
{% endblock %}
